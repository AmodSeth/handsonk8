site_name: HandsOnK8 Notes
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
    - scheme: slate
      primary: indigo
      accent: deep purple
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - footnotes
  - codehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Kubernetes Learning:
      - Overview: kubernetes-learning-index.md
      - Sections:
          - Section 1 - Basics:
            - Overview: 1_sec_Basics/1_index.md
            - Section 1.1 - Installation: 1_sec_Basics/Section_1_installation.md
            - Section 1.2 - Pods: 1_sec_Basics/Section_2_pods.md
            - Section 1.3 - Services: 1_sec_Basics/Section_3_services.md
            - Section 1.4 - ReplicaSets: 1_sec_Basics/Section_4_replicasets.md
            - Section 1.5 - Deployments: 1_sec_Basics/Section_5_deployments.md
            - Section 1.6 - Networking: 1_sec_Basics/Section_6_networkandservicediscovery.md
          - Section 2 - Scheduling:
            - Overview: 2_sec_scheduling/1_index.md
            - Labels and Selectors: 2_sec_scheduling/2_labelsandselectors.md
            - Taints and Tolerations: 2_sec_scheduling/3_taintsandtoleration.md
            - Node Selectors and Affinity: 2_sec_scheduling/4_nodeselectorsandaffinity.md
  - Minikube:
      - Overview: minikube/index.md
      - Commands & Strategies:
          - Basic Commands: minikube/basic_commands.md
          - Deployment Strategies:
              - Overview: minikube/Deployment-strategies/index.md
              - Release Based: minikube/Deployment-strategies/Release-based.md
  - Microservices:
      - Overview: microservice/index.md
      - Guides:
          - Deploying Queue: microservice/deploying-queue.md
  - Troubleshooting:
      - Overview: Troubleshooting/index.md
      - Issues:
          - Resource Name Empty: Troubleshooting/Resource_name_can't_be_empty.md
          - ReplicaSet Issues: Troubleshooting/Replicaset_wont_touch_me.md
          - Pod Recovery: Troubleshooting/Why_Pod_didn't_Came_back.md

    
  

